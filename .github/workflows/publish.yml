on:
  push:
    branches: [main]
  # This tool encourages you to run it on pull requests to test the deployment process.
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # If your deploy script that you write needs to push a git commit, git tag, or create a GitHub Release.
      pull-requests: write # If you enable pull request comments (they are enabled by default).
      id-token: write # required by jsr and npm for publishing package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5

      - uses: levibostian/decaf@366970ed9e5059c9a9cf3b3237b3f19dfa0369ad # 0.17.3
        env:
          # required to use 'gh' CLI in my step scripts.
          GH_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          get_latest_release_current_branch: decaf shebang https://github.com/levibostian/decaf-script-github-releases.git/shebang.sh@1.3.0 get
          get_next_release_version: decaf shebang https://github.com/levibostian/decaf-script-conventional-commits.git/shebang.sh@0.3.1
          deploy: |
            VERSION="{{nextVersionName}}"
            VERSION="$VERSION" mise run build-all
            VERSION="$VERSION" mise run packslip
            decaf shebang https://github.com/levibostian/decaf-script-github-releases.git/shebang.sh@1.3.0 set-assets "dist/jj-split-cli_${VERSION}_linux_amd64.tar.gz" "dist/jj-split-cli_${VERSION}_linux_arm64.tar.gz" "dist/jj-split-cli_${VERSION}_darwin_amd64.tar.gz" "dist/jj-split-cli_${VERSION}_darwin_arm64.tar.gz" "dist/jj-split-cli_${VERSION}_windows_amd64.zip" "dist/jj-split-cli_${VERSION}_windows_arm64.zip" "dist/packslip.sigstore.json"
            decaf shebang https://github.com/levibostian/decaf-script-github-releases.git/shebang.sh@1.3.0 set
